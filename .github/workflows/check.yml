name: Check minutes

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check minutes files
        run: npm run validate
      - name: Test that the site builds
        run: npx @11ty/eleventy --quiet
